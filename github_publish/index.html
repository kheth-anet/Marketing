document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le=\"padding:7px 10px;\"><span style=\"font-size:16px; color:rgb(53,59,71);\">Teacher<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:7px 10px;\"><span style=\"font-size:16px; color:rgb(53,59,71);\">Student<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:7px 10px;\"><span style=\"font-size:16px; color:rgb(53,59,71);\">Standard<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:6px 8px 2px;\"><span style=\"font-weight:700; font-size:16px; color:rgb(53,59,71);\">Period Performance<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:7px 10px;\"><span style=\"font-size:16px; color:rgb(53,59,71);\">Standard<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:6px 8px 2px;\"><span style=\"font-weight:700; font-size:16px; color:rgb(53,59,71);\">Individual Student Performance<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:7px 10px;\"><span style=\"font-size:16px; color:rgb(53,59,71);\">Take Home<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:6px 8px 2px;\"><span style=\"font-weight:700; font-size:16px; color:rgb(53,59,71);\">Tools and Resources<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:7px 10px;\"><span style=\"font-size:16px; color:rgb(53,59,71);\">Manage Custom Groups<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:7px 10px;\"><span style=\"font-size:16px; color:rgb(53,59,71);\">Data Export<\u002Fspan><\u002Fdiv>\n        <div style=\"padding:7px 10px;\"><span style=\"font-size:16px; color:rgb(53,59,71);\">Helpful Resources<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- GRAY CONTAINER -->\n      <div style=\"flex-grow:1; border-radius:4px; background:rgb(246,247,249); display:flex; flex-direction:row; padding:16px; align-items:flex-start; position:relative;\">\n\n        <!-- WHITE CONTAINER -->\n        <div style=\"flex-grow:1; overflow:hidden; border-radius:4px; background:rgb(255,255,255); display:flex; flex-direction:column; gap:24px; padding:24px 0; align-items:flex-start; position:relative;\">\n\n          <!-- FILT            <span style=\"font-weight:700; font-size:18px; color:rgb(53,59,71);\">What misconceptions are blocking understanding?<\u002Fspan>\n                <\u002Fdiv>\n                <a href=\"#\" sc-camel-on-click=\"{{ openQuestions }}\" style=\"font-weight:700; font-size:16px; color:rgb(0,120,163); cursor:pointer;\">View All Misconceptions<\u002Fa>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:row; gap:16px; align-items:stretch;\">\n                <div style=\"flex:1; border-radius:4px; background:rgb(255,255,255); box-shadow:inset 0 0 0 1px rgb(213,217,226); padding:20px; display:flex; flex-direction:column; gap:12px;\">\n                  <span style=\"font-size:16px; color:rgb(53,59,71); line-height:1.4;\"><strong>78% of students (19)<\u002Fstrong> had this misconception<\u002Fspan>\n                  <span style=\"font-size:16px; color:rgb(53,59,71); line-height:1.4;\">Student did not recognize that the unit rate describes the amount of one quantity per unit of another quantity.<\u002Fspan>\n                  <div sc-camel-on-click=\"{{ openQuestions }}\" style=\"background:rgb(34,126,167); color:rgb(255,255,255); border-radius:6px; height:37px; padding:0 18px; display:flex; align-items:center; align-self:flex-start; font-weight:700; font-size:16px; cursor:pointer; user-select:none;\">View Question<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:1; border-radius:4px; background:rgb(255,255,255); box-shadow:inset 0 0 0 1px rgb(213,217,226); padding:20px; display:flex; flex-direction:column; gap:12px;\">\n                  <span style=\"font-size:16px; color:rgb(53,59,71); line-height:1.4;\"><strong>35% of students (8)<\u002Fstrong> had this misconception<\u002Fspan>\n                  <span style=\"font-size:16px; color:rgb(53,59,71); line-height:1.4;\">Rather than finding the unit rate, students found the additive relationship between the given quantities and added to the given price.<\u002Fspan>\n                  <div sc-camel-on-click=\"{{ openQuestions }}\" style=\"background:rgb(34,126,167); color:rgb(255,255,255); border-radius:6px; height:37px; padding:0 18px; display:flex; align-items:center; align-self:flex-start; font-weight:700; font-size:16px; cursor:pointer; user-select:none;\">View Question<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"align-self:stretch; height:1px; background:rgb(213,217,226); margin:8px 0;\"><\u002Fdiv>\n\n            <span style=\"font-weight:700; font-size:22px; color:rgb(53,59,71);\">Next steps to consider<\u002Fspan>\n            <div style=\"display:flex; flex-direction:row; gap:12px; align-items:center;\">\n              <span style=\"width:20px; height:20px; flex-shrink:0; color:rgb(53,59,71); display:inline-flex;\"><svg sc-camel-view-box=\"0 0 14 14\" width=\"100%\" height=\"100%\"><path d=\"M 10.973 13.346 C 10.881 13.346 10.79 13.324 10.706 13.28 L 7 11.331 L 3.295 13.28 C 3.102 13.382 2.867 13.364 2.691 13.236 C 2.514 13.108 2.426 12.891 2.463 12.676 L 3.171 8.549 L 0.173 5.628 C 0.017 5.475 -0.039 5.247 0.028 5.04 C 0.095 4.833 0.275 4.682 0.49 4.65 L 4.633 4.048 L 6.486 0.293 C 6.679 -0.098 7.321 -0.098 7.514 0.293 L 9.367 4.048 L 13.51 4.65 C 13.725 4.682 13.905 4.833 13.972 5.04 C 14.039 5.247 13.983 5.475 13.827 5.628 L 10.829 8.549 L 11.537 12.676 C 11.573 12.891 11.486 13.108 11.309 13.236 C 11.21 13.309 11.091 13.346 10.973 13.346 Z M 7 10.111 C 7.092 10.111 7.184 10.133 7.267 10.177 L 10.212 11.725 L 9.649 8.446 C 9.617 8.26 9.679 8.07 9.815 7.939 L 12.196 5.617 L 8.904 5.139 C 8.717 5.111 8.555 4.994 8.473 4.825 L 7 1.842 L 5.528 4.825 C 5.445 4.994 5.283 5.112 5.097 5.139 L 1.805 5.617 L 4.186 7.939 C 4.321 8.07 4.383 8.26 4.351 8.446 L 3.789 11.725 L 6.734 10.177 C 6.818 10.133 6.909 10.111 7 10.111 Z\" fill=\"currentColor\" fill-rule=\"evenodd\" transform=\"matrix(1 0 0 1 0 0.327)\"><\u002Fpath>< le=\"display:flex; flex-direction:row; gap:12px; align-items:flex-start;\">\n              <span style=\"width:20px; height:20px; flex-shrink:0; color:rgb(53,59,71); margin-top:2px; display:inline-flex;\"><svg sc-camel-view-box=\"0 0 14 14\" width=\"100%\" height=\"100%\"><path d=\"M 4.162 1.514 L 4.162 0.568 C 4.162 0.254 3.908 0 3.595 0 C 3.281 0 3.027 0.254 3.027 0.568 L 3.027 1.514 L 2.081 1.514 C 0.932 1.514 0 2.445 0 3.595 L 0 11.919 C 0 13.068 0.932 14 2.081 14 L 9.649 14 C 10.798 14 11.73 13.068 11.73 11.919 L 11.73 3.595 C 11.73 2.445 10.798 1.514 9.649 1.514 L 8.703 1.514 L 8.703 0.568 C 8.703 0.254 8.449 0 8.135 0 C 7.822 0 7.568 0.254 7.568 0.568 L 7.568 1.514 L 4.162 1.514 Z M 1.135 6.811 L 10.595 6.811 L 10.595 11.919 C 10.595 12.441 10.171 12.865 9.649 12.865 L 2.081 12.865 C 1.559 12.865 1.135 12.441 1.135 11.919 L 1.135 6.811 Z\" fill=\"currentColor\" fill-rule=\"nonzero\" transform=\"matrix(1 0 0 1 1.135 0)\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div style=\"display:flex; flex-direction:column; gap:4px;\">\n                <span style=\"font-weight:700; font-size:16px; color:rgb(53,59,71);\">Prepare for the next assessment<\u002Fspan>\n                <span style=\"font-size:16px; color:rgb(53,59,71); line-height:1.4;\">Use the next cycle's Prepare for Instruction report to anticipate strengths and challenges in upcoming lessons.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-radius:4px; box-shadow:inset 0 0 0 1px rgb(213,217,226); padding:20px; margin-top:8px;\">\n              <span style=\"font-size:16px; color:rgb(53,59,71); line-height:1.4;\">For more information on how to use this data, read the <a href=\"#\">Data Analysis Guide<\u002Fa>.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"align-self:stretch; display:flex; flex-direction:row; align-items:center; gap:16px; padding:16px 64px; background:rgb(246,247,249); border-top:1px solid rgb(222,226,230);\">\n    <a href=\"#\" style=\"font-size:14px;\">Privacy Policy<\u002Fa>\n    <a href=\"#\" style=\"font-size:14px;\">Terms of Use<\u002Fa>\n    <a href=\"#\" style=\"font-size:14px;\">Student Privacy<\u002Fa>\n    <span style=\"font-size:14px; color:rgb(109,109,109);\">© 2026 The Achievement Network, Ltd. All Rights Reserved.<\u002Fspan>\n    <img src=\"192703f0-48d2-4a7e-a99d-ec783a6485a9\" alt=\"ANet\" style=\"height:28px; object-fit:contain; margin-left:auto;\">\n  <\u002Fdiv>\n\n  <!-- =========== DATA MODAL =========== -->\n  <sc-if value=\"{{ showData }}\">\n    <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.24); display:flex; align-items:center; justify-content:center; padding:40px;\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:720px; max-width:100%; background:rgb(255,255,255); border-radius:8px; border:1px dashed rgb(213,217,226); box-shadow:0 12px 32px rgba(0,0,0,0.18); padding:40px; display:flex; flex-direction:column; gap:24px;\">\n        <div style=\"display:flex; flex-direction:row; align-items:flex-start; justify-content:space-between; gap:16px;\">\n          <span style=\"font-weight:700; font-size:30px; color:rgb(35,39,46); line-height:1.15;\">Understanding Your Diagnostic Data<\u002Fspan>\n          <span sc-camel-on-click=\"{{ closeModal }}\" style=\"width:20px; height:20px; flex-shrink:0; color:rgb(103,112,125); cursor:pointer; margin-top:6px; display:inline-flex;\"><svg sc-camel-view-box=\"0 0 14 14\" width=\"100%\" height=\"100%\"><path d=\"M 0.212 0.212 C 0.495 -0.071 0.953 -0.071 1.235 0.212 L 5.5 4.477 L 9.765 0.212 C 10.047 -0.071 10.505 -0.071 10.788 0.212 C 11.071 0.495 11.071 0.953 10.788 1.235 L 6.523 5.5 L 10.788 9.765 C 11.071 10.047 11.071 10.505 10.788 10.788 C 10.505 11.071 10.047 11.071 9.765 10.788 L 5.5 6.523 L 1.235 10.788 C 0.953 11.071 0.495 11.071 0.212 10.788 C -0.071 10.505 -0.071 10.047 0.212 9.765 L 4.477 5.5 L 0.212 1.235 C -0.071 0.953 -0.071 0.495 0.212 0.212 Z\" fill=\"currentColor\" transform=\"matrix(1 0 0 1 1.5 1.5)\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:18px; color:rgb(53,59,71); line-height:1.5;\">Unlike traditional diagnostics that measure what students currently know, ANet's Diagnostic predicts how students will perform after they've have been taught the material.<\u002Fspan>\n        <span style=\"font-size:18px; color:rgb(53,59,71); line-height:1.5;\">Each cycle predicts performance on the main learning components (building blocks of standards) within your upcoming lessons.<\u002Fspan>\n        <span style=\"font-size:18px; color:rgb(53,59,71); line-height:1.5;\">With this forward-looking view, you can proactively adjust instruction based on what is likely to be a strength or a challenge for your class.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- =========== QUESTIONS MODAL =========== -->\n  <sc-if value=\"{{ showQuestions }}\">\n    <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.24); display:flex; align-items:center; justify-content:center; padding:5vh 5vw;\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:90vw; height:90vh; background:rgb(255,255,255); border-radius:8px; border:1px dashed rgb(213,217,226); box-shadow:0 12px 32px rgba(0,0,0,0.18); overflow:auto; padding:24px 40px 40px;\">\n        <div style=\"position:relative; display:flex; align-items:center; justify-content:center; padding:8px 0 24px;\">\n          <span style=\"font-weight:700; font-size:24px; color:rgb(35,39,46);\">Questions<\u002Fspan>\n          <span sc-camel-on-click=\"{{ closeModal }}\" style=\"position:absolute; right:0; top:8px; width:20px; height:20px; color:rgb(103,112,125); cursor:pointer; display:inline-flex;\"><svg sc-camel-view-box=\"0 0 14 14\" width=\"100%\" height=\"100%\"><path d=\"M 0.212 0.212 C 0.495 -0.071 0.953 -0.071 1.235 0.212 L 5.5 4.477 L 9.765 0.212 C 10.047 -0.071 10.505 -0.071 10.788 0.212 C 11.071 0.495 11.071 0.953 10.788 1.235 L 6.523 5.5 L 10.788 9.765 C 11.071 10.047 11.071 10.505 10.788 10.788 C 10.505 11.071 10.047 11.071 9.765 10.788 L 5.5 6.523 L 1.235 10.788 C 0.953 11.071 0.495 11.071 0.212 10.788 C -0.071 10.505 -0.071 10.047 0.212 9.765 L 4.477 5.5 L 0.212 1.235 C -0.071 0.953 -0.071 0.495 0.212 0.212 Z\" fill=\"currentColor\" transform=\"matrix(1 0 0 1 1.5 1.5)\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:row; align-items:flex-end; border-top:2px dashed rgb(213,217,226); border-right:2px dashed rgb(213,217,226); border-bottom:1px dashed rgb(213,217,226); border-left:2px dashed rgb(213,217,226); margin-bottom:24px;\">\n          <sc-for list=\"{{ qTabs }}\" as=\"qt\" hint-placeholder-count=\"4\">\n            <div sc-camel-on-click=\"{{ qt.onClick }}\" style=\"display:flex; padding:14px 18px; align-items:center; cursor:pointer; border-right:1px dashed rgb(213,217,226); {{ qt.border }}\">\n              <span style=\"font-size:16px; white-space:nowrap; color:{{ qt.color }};\">{{ qt.label }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"font-weight:700; font-size:20px; color:rgb(53,59,71); margin-bottom:20px;\">Question {{ qTab }}<\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:2px; margin-bottom:8px;\">\n          <span style=\"font-weight:700; font-size:16px; color:rgb(53,59,71);\">Multiple Select<\u002Fspan>\n          <span style=\"font-weight:700; font-size:16px; color:rgb(53,59,71);\">Points Available: 1<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:16px; color:rgb(53,59,71); line-height:1.5; margin:0 0 8px;\">Marcus is putting together food baskets for a Thanksgiving food drive and is determining how much he will spend on cranberry sauce. At a grocery store, the price of 5 cans of cranberry sauce is $8.80.<\u002Fp>\n        <p style=\"font-size:16px; color:rgb(53,59,71); line-height:1.5; margin:0 0 16px;\">At this rate, how much would 21 cans of cranberry sauce cost?<\u002Fp>\n\n        <div style=\"display:flex; flex-direction:column; margin-bottom:32px; border:1px solid rgb(222,226,230); border-radius:4px; overflow:hidden;\">\n          <div style=\"display:flex; flex-direction:row; align-items:center; background:rgb(245,245,245); border-bottom:1px solid rgb(222,226,230);\">\n            <div style=\"width:80px; text-align:center; font-size:28px; color:rgb(109,109,109); padding:14px 0;\">A<\u002Fdiv>\n            <div style=\"padding-left:24px; font-size:17px; color:rgb(109,109,109);\">$11.97<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:row; align-items:center; background:rgb(245,245,245); border-bottom:1px solid rgb(222,226,230);\">\n            <div style=\"width:80px; text-align:center; font-size:28px; color:rgb(109,109,109); padding:14px 0;\">B<\u002Fdiv>\n            <div style=\"padding-left:24px; font-size:17px; color:rgb(109,109,109);\">$24.80<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:row; align-items:center; background:rgb(245,245,245); border-bottom:1px solid rgb(222,226,230);\">\n            <div style=\"width:80px; text-align:center; font-size:28px; color:rgb(109,109,109); padding:14px 0;\">C<\u002Fdiv>\n            <div style=\"padding-left:24px; font-size:17px; color:rgb(109,109,109);\">$35.20<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:row; align-items:center; background:rgb(252,252,222); border-left:6px solid rgb(4,120,87);\">\n            <div style=\"width:74px; text-align:center; font-size:28px; color:rgb(53,59,71); padding:14px 0;\">D<\u002Fdiv>\n            <div style=\"padding-left:24px; font-size:17px; color:rgb(53,59,71);\">$36.96<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"font-weight:700; font-size:18px; color:rgb(53,59,71); margin-bottom:16px;\">Distractor Rationale and Percentage by Answer<\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; border:1px dashed rgb(213,217,226); border-radius:4px; overflow:hidden; margin-bottom:40px;\">\n          <div style=\"display:flex; flex-direction:row; align-items:flex-start; border-bottom:1px dashed rgb(213,217,226);\">\n            <div style=\"width:110px; flex-shrink:0; padding:20px; font-size:16px; color:rgb(53,59,71);\">0%<\u002Fdiv>\n            <div style=\"width:70px; flex-shrink:0; padding:20px 0; display:flex; justify-content:center;\"><span style=\"width:24px; height:24px; border-radius:50%; background:rgb(255,203,206); color:rgb(155,28,28); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;\">A<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1; padding:20px 24px 20px 8px; display:flex; flex-direction:column; gap:8px;\">\n              <span style=\"font-weight:700; font-size:16px; color:rgb(53,59,71);\">$11.97<\u002Fspan>\n              <span style=\"font-size:16px; color:rgb(53,59,71); line-height:1.5;\"><strong>Rationale:<\u002Fstrong> Student found the unit price as the amount of the item per dollar instead of cost per item and multiplied this unit price by the new amount of the item.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:row; align-items:flex-start; border-bottom:1px dashed rgb(213,217,226);\">\n            <div style=\"width:110px; flex-shrink:0; padding:20px; font-size:16px; color:rgb(53,59,71);\">20%<\u002Fdiv>\n            <div style=\"width:70px; flex-shrink:0; padding:20px 0; display:flex; justify-content:center;\"><span style=\"width:24px; height:24px; border-radius:50%; background:rgb(255,203,206); color:rgb(155,28,28); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;\">B<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1; padding:20px 24px 20px 8px; display:flex; flex-direction:column; gap:8px;\">\n              <span style=\"font-weight:700; font-size:16px; color:rgb(53,59,71);\">$24.80<\u002Fspan>\n              <span style=\"font-size:16px; color:rgb(53,59,71); line-height:1.5;\"><strong>Rationale:<\u002Fstrong> Student applied an additive relationship between the two quantities without determining the unit price, adding the difference in amounts of the item directly to the initial cost.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:row; align-items:flex-start; border-bottom:1px dashed rgb(213,217,226);\">\n            <div style=\"width:110px; flex-shrink:0; padding:20px; font-size:16px; color:rgb(53,59,71);\">6%<\u002Fdiv>\n            <div style=\"width:70px; flex-shrink:0; padding:20px 0; display:flex; justify-content:center;\"><span style=\"width:24px; height:24px; border-radius:50%; background:rgb(255,203,206); color:rgb(155,28,28); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;\">C<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1; padding:20px 24px 20px 8px; display:flex; flex-direction:column; gap:8px;\">\n              <span style=\"font-weight:700; font-size:16px; color:rgb(53,59,71);\">$35.20<\u002Fspan>\n              <span style=\"font-size:16px; color:rgb(53,59,71); line-height:1.5;\"><strong>Rationale:<\u002Fstrong> Student estimated a multiplicative relationship based on how many times larger one quantity of the item was than another, without calculating the actual unit price.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:row; align-items:flex-start;\">\n            <div style=\"width:110px; flex-shrink:0; padding:20px; font-size:16px; color:rgb(53,59,71);\">74%<\u002Fdiv>\n            <div style=\"width:70px; flex-shrink:0; padding:20px 0; display:flex; justify-content:center;\"><span style=\"width:24px; height:24px; border-radius:50%; background:rgb(167,243,208); color:rgb(4,120,87); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;\">D<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1; padding:20px 24px 20px 8px; display:flex; flex-direction:column; gap:8px;\">\n              <span style=\"font-weight:700; font-size:16px; color:rgb(53,59,71);\">Correct Answer<\u002Fspan>\n              <span style=\"font-size:16px; color:rgb(53,59,71);\">$36.96<\u002Fspan>\n              <span style=\"font-size:16px; color:rgb(53,59,71); line-height:1.5;\"><strong>Rationale:<\u002Fstrong> Correct.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:row; border-top:1px dashed rgb(213,217,226);\">\n          <div style=\"flex:1; padding:20px 16px; border-right:1px dashed rgb(213,217,226);\">\n            <div style=\"font-weight:700; font-size:16px; color:rgb(53,59,71); margin-bottom:16px;\">A(0)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; padding:20px 16px; border-right:1px dashed rgb(213,217,226);\">\n            <div style=\"font-weight:700; font-size:16px; color:rgb(53,59,71); margin-bottom:16px;\">B(5)<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:6px; font-size:16px; color:rgb(53,59,71);\">\n              <span>Chelsea Rush<\u002Fspan><span>Frankie Petersen<\u002Fspan><span>Gloria Cervantes<\u002Fspan><span>Liza Sosa<\u002Fspan><span>Marcelino Mercado<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; padding:20px 16px; border-right:1px dashed rgb(213,217,226);\">\n            <div style=\"font-weight:700; font-size:16px; color:rgb(53,59,71); margin-bottom:16px;\">C(1)<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:6px; font-size:16px; color:rgb(53,59,71);\">\n              <span>Dion Faulkner<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1; padding:20px 16px;\">\n            <div style=\"font-weight:700; font-size:16px; color:rgb(53,59,71); margin-bottom:16px;\">D(18)<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:6px; font-size:16px; color:rgb(53,59,71);\">\n              <span>Abe Colon<\u002Fspan><span>Alicia Reed<\u002Fspan><span>Al Oneal<\u002Fspan><span>Cora Rosario<\u002Fspan><span>Dion Valentine<\u002Fspan><span>Eugenia Aguilar<\u002Fspan><span>Ezequiel Shields<\u002Fspan><span>Inez Glover<\u002Fspan><span>Joanne Garcia<\u002Fspan><span>Juan Mccall<\u002Fspan><span>Jude Mason<\u002Fspan><span>Kathie Long<\u002Fspan><span>Keisha Conway<\u002Fspan><span>Kimberley Mata<\u002Fspan><span>Lindsey Alvarez<\u002Fspan><span>Marcie Lopez<\u002Fspan><span>Rocco Houston<\u002Fspan><span>Socorro Wade<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;classSize&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;min&quot;:1,&quot;max&quot;:40,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Report data&quot;,&quot;unit&quot;:&quot; students&quot;},&quot;strengthThreshold&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:63,&quot;min&quot;:40,&quot;max&quot;:85,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Report data&quot;,&quot;unit&quot;:&quot;%&quot;},&quot;showMisconceptions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Review Performance&quot;}}\">\nclass Component extends DCLogic {\n  state = { tab: \"prepare\", modal: null, qTab: 1, tooltip: true, grade: 6, period: \"G6-Period-1\", cycle: \"Milestone 2\", openF: null, report: { grade: 6, milestone: 2 }, lcmap: null };\n\n  componentDidMount() {\n    import(window.__resources.lcmap).then((m) => this.setState({ lcmap: m.LCMAP })).catch(() => {});\n  }\n\n  pct(grade, ms, lc) {\n    const s = grade + \"|\" + ms + \"|\" + lc;\n    let h = 0;\n    for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }\n    return 38 + (h % 55); // 38..92\n  }\n\n  renderVals() {\n    const tab = this.state.tab;\n    const modal = this.state.modal;\n\n    const CLASS_TOTAL = this.props.classSize ?? 24;\n    const THRESHOLD = this.props.strengthThreshold ?? 63;\n    const report = this.state.report;\n    const lcmap = this.state.lcmap;\n    const rawLcs = (lcmap && lcmap[report.grade] && lcmap[report.grade][report.milestone]) || [];\n    const items = rawLcs.map((lc, i) => {\n      const p = this.pct(report.grade, report.milestone, lc);\n      return { lc, p, q: i + 1, kind: p >= THRESHOLD ? \"strength\" : \"challenge\" };\n    });\n    const strengthItems = items.filter((x) => x.kind === \"strength\").sort((a, b) => b.p - a.p);\n    const challengeItems = items.filter((x) => x.kind === \"challenge\").sort((a, b) => a.p - b.p);\n    const strengths = strengthItems.map((x, i) => ({ n: String(i + 1), lc: x.lc }));\n    const challenges = challengeItems.map((x, i) => ({ n: String(i + 1), lc: x.lc }));\n    const reviewRows = items.slice().sort((a, b) => b.p - a.p).map((x) => {\n      const n = Math.round((CLASS_TOTAL * x.p) / 100);\n      return {\n        lc: x.lc.endsWith(\".\") ? x.lc : x.lc + \".\",\n        q: String(x.q),\n        pct: x.p + \"% of students (\" + n + \")\",\n        open: () => this.setState({ modal: \"questions\", qTab: Math.max(1, Math.min(x.q, 4)) }),\n      };\n    });\n    const overallPct = items.length ? Math.round(items.reduce((s, x) => s + x.p, 0) / items.length) : 0;\n    const successN = Math.round((CLASS_TOTAL * overallPct) / 100);\n    const supportN = CLASS_TOTAL - successN;\n\n    const qTabs = [1, 2, 3, 4].map((n) => {\n      const active = this.state.qTab === n;\n      return {\n        label: \"Question \" + n,\n        color: active ? \"rgb(34,126,167)\" : \"rgb(53,59,71)\",\n        border: active ? \"border-bottom:2px solid rgb(34,126,167);\" : \"\",\n        onClick: () => this.setState({ qTab: n }),\n      };\n    });\n\n    const { grade, period, cycle, openF } = this.state;\n    const gray = \"rgb(109,109,109)\";\n    const ink = \"rgb(53,59,71)\";\n\n    const gradeOptions = [2, 3, 4, 5, 6, 7, 8].map((g) => ({\n      label: \"Grade \" + g,\n      onClick: () => this.setState({ grade: g, period: null, cycle: null, openF: null }),\n    }));\n    const periodOptions = grade\n      ? [{\n          label: \"G\" + grade + \"-Period-1\",\n          onClick: () => this.setState({ period: \"G\" + grade + \"-Period-1\", cycle: null, openF: null }),\n        }]\n      : [];\n    const cycleOptions = [1, 2, 3, 4, 5, 6, 7, 8].map((c) => ({\n      label: \"Milestone \" + c,\n      onClick: () => this.setState({ cycle: \"Milestone \" + c, openF: null }),\n    }));\n\n    return {\n      lcRows: reviewRows, qTabs,\n      strengths, challenges,\n      noStrengths: items.length > 0 && strengths.length === 0,\n      noChallenges: items.length > 0 && challenges.length === 0,\n      reportTitle: \"Math Teacher Report: Milestone \" + report.milestone,\n      overallText: overallPct + \"% of your class (\" + successN + \") is likely to be successful with upcoming instruction\",\n      successBarPct: overallPct + \"%\",\n      supportBarPct: (100 - overallPct) + \"%\",\n      successLegend: overallPct + \"% of your class (\" + successN + \") is likely to be successful\",\n      supportLegend: (100 - overallPct) + \"% of your class (\" + supportN + \") is likely to need extra support\",\n      qTab: this.state.qTab,\n      gradeOptions, periodOptions, cycleOptions,\n      gradeText: grade ? \"Grade \" + grade : \"Select\",\n      gradeColor: grade ? ink : gray,\n      periodText: period || \"Select\",\n      periodColor: period ? ink : gray,\n      periodOpacity: grade ? \"1\" : \"0.5\",\n      cycleText: cycle || \"Select\",\n      cycleColor: cycle ? ink : gray,\n      cycleOpacity: period ? \"1\" : \"0.5\",\n      gradeOpen: openF === \"grade\",\n      periodOpen: openF === \"period\",\n      cycleOpen: openF === \"cycle\",\n      toggleGrade: () => this.setState({ openF: openF === \"grade\" ? null : \"grade\" }),\n      togglePeriod: () => { if (!grade) return; this.setState({ openF: openF === \"period\" ? null : \"period\" }); },\n      toggleCycle: () => { if (!period) return; this.setState({ openF: openF === \"cycle\" ? null : \"cycle\" }); },\n      isPrepare: tab === \"prepare\",\n      isReview: tab === \"review\",\n      prepTabColor: tab === \"prepare\" ? \"rgb(34,126,167)\" : \"rgb(53,59,71)\",\n      revTabColor: tab === \"review\" ? \"rgb(34,126,167)\" : \"rgb(53,59,71)\",\n      prepTabBorder: tab === \"prepare\" ? \"border-bottom:2px solid rgb(34,126,167);\" : \"\",\n      revTabBorder: tab === \"review\" ? \"border-bottom:2px solid rgb(34,126,167);\" : \"\",\n      showData: modal === \"data\",\n      showQuestions: modal === \"questions\",\n      showMisconceptions: this.props.showMisconceptions ?? true,\n      showTooltipPrep: this.state.tooltip && !modal && tab === \"prepare\",\n      showTooltipRev: this.state.tooltip && !modal && tab === \"review\",\n      goPrepare: () => this.setState({ tab: \"prepare\", tooltip: true }),\n      goReview: () => this.setState({ tab: \"review\", tooltip: true }),\n      openData: () => this.setState({ modal: \"data\" }),\n      openQuestions: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ modal: \"questions\", qTab: 1 }); },\n      openReviewQ: (e) => {\n        if (e && e.preventDefault) e.preventDefault();\n        const el = e && e.currentTarget;\n        const q = el ? parseInt(el.getAttribute(\"data-q\"), 10) : 1;\n        this.setState({ modal: \"questions\", qTab: Math.max(1, Math.min(q || 1, 4)) });\n      },\n      closeModal: () => this.setState({ modal: null }),\n      dismissTooltip: () => this.setState({ tooltip: false }),\n      applyView: () => {\n        this.setState((s) => {\n          const g = s.grade;\n          const ms = s.cycle ? parseInt(String(s.cycle).replace(\"Milestone \", \"\"), 10) : null;\n          if (!g || !ms) return { tooltip: false, openF: null };\n          return { report: { grade: g, milestone: ms }, tooltip: false, openF: null };\n        });\n      },\n      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
