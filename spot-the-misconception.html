<style>
  /* ---------------------------------------------------------------
     DESIGN TOKENS — pulled from the live Compass Math report build
     (Compass Math Teacher Report.dc.html) so this matches the
     product exactly. Change here to re-theme the whole activity.
  --------------------------------------------------------------- */
  :root{
    --ink:        #353B47;
    --muted:      #67707D;
    --border:     #D5D9E2;
    --card:       #F6F7F9;
    --page:       #E2E6EC;
    --white:      #FFFFFF;
    --brand:      #227EA7;
    --brand-light:#66BBDC;
    --brand-dark: #005979;
    --brand-tint: #E5F2F9;
    --good:       #047857;
    --good-tint:  #E4F5EE;
    --bad:        #B3261E;
    --bad-tint:   #FCEBEA;
    --gold:       #E8A33D;
    --gold-tint:  #FDF1E0;
    --radius:     14px;
    --radius-sm:  10px;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    margin:0;
    background:var(--page);
    font-family:"Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    overscroll-behavior: none;
    user-select:none;
  }
  #stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- header ---------- */
  header{
    align-self:stretch;
    background:var(--white);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px 20px;
  }
  header img.logo{ height:38px; width:auto; display:block; }
  header .divider{ width:1px; height:24px; background:var(--border); }
  header .title{ font-weight:700; font-size:16px; color:var(--ink); white-space:nowrap; }
  header .spacer{ flex:1; }
  /* ---------- generic layout ---------- */
  main{
    flex:1;
    align-self:stretch;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 20px 60px;
  }
  .wrap{ width:100%; max-width:640px; display:flex; flex-direction:column; gap:20px; }

  /* ---------- start screen ---------- */
  .hero{ text-align:center; padding:20px 8px 4px; }
  .hero h1{
    margin:0 0 12px;
    font-size:34px;
    line-height:1.15;
    font-weight:900;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .hero p{
    margin:0 auto 10px; max-width:46ch;
    font-size:16px; line-height:1.55; color:var(--muted);
  }
  .hero p:last-child{ margin-bottom:0; }
  .band-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:8px; }
  .band-tile{
    background:var(--white); border:1px solid var(--border); border-top:5px solid var(--brand-light);
    border-radius:var(--radius); min-height:150px; padding:20px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:inherit; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .band-tile:active{ transform:scale(.97); }
  .band-tile:hover{ box-shadow:0 4px 14px rgba(102,187,220,.3); }
  .band-tile .lbl{ font-size:26px; font-weight:900; color:var(--ink); line-height:1.15; }

  /* ---------- question screen ---------- */
  .task-head{ margin:0 0 12px; font-size:22px; line-height:1.25; font-weight:900; color:var(--ink); }
  .q-img{ display:block; max-width:100%; height:auto; border:1px solid var(--border); border-radius:var(--radius-sm); margin-top:14px; }
  .choice{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px 16px; margin-bottom:10px; min-height:56px;
    font-family:inherit; font-size:16px; line-height:1.4; color:var(--ink);
    cursor:pointer; transition:border-color .12s ease, transform .08s ease;
  }
  .choice:hover{ border-color:var(--brand); }
  .choice:active{ transform:scale(.99); }
  .choice-letter{
    flex-shrink:0; width:34px; height:34px; border-radius:8px;
    background:var(--white); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:900; color:var(--muted);
  }
  .choice-text{ flex:1; }
  .rv-row{
    display:flex; align-items:flex-start; gap:14px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px 16px; margin-bottom:10px;
  }
  .rv-main{ flex:1; min-width:0; }
  .rv-top{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; font-size:16px; line-height:1.4; }
  .rv-pct{ font-size:18px; font-weight:900; color:var(--ink); }
  .rv-bar{ height:8px; border-radius:4px; background:var(--border); margin-top:8px; overflow:hidden; }
  .rv-bar span{ display:block; height:100%; width:0; border-radius:4px; background:var(--muted); transition:width .7s cubic-bezier(.2,.8,.2,1); }
  .rv-row.correct{ background:var(--good-tint); border-color:var(--good); }
  .rv-row.correct .rv-bar span{ background:var(--good); }
  .rv-row.top{ background:var(--bad-tint); border-color:var(--bad); }
  .rv-row.top .rv-bar span{ background:var(--bad); }
  .rv-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .rv-tags:empty{ display:none; }
  .tag{ font-size:11.5px; font-weight:800; border-radius:999px; padding:3px 10px; }
  .tag.you{ background:var(--ink); color:var(--white); }
  .tag.ok{ background:var(--good); color:var(--white); }
  .tag.trap{ background:var(--bad); color:var(--white); }
  .banner{
    margin-top:14px; padding:14px 16px; border-radius:var(--radius-sm);
    background:var(--brand-tint); color:var(--brand-dark);
    font-size:16px; font-weight:800; line-height:1.4;
  }
  .callout{
    margin-top:12px; padding:14px 16px; border-radius:var(--radius-sm);
    background:var(--card); border:1px solid var(--border);
    font-size:14.5px; line-height:1.5; color:var(--ink);
  }
  .callout strong{ display:block; margin-bottom:2px; }
  .card{
    background:var(--white);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px;
  }
  .eyebrow{ font-size:13px; font-weight:700; color:var(--brand-light); margin:0 0 8px; }
  .q-text{ font-size:19px; line-height:1.5; font-weight:700; color:var(--ink); margin:0; }
  .prompt{ margin:20px 0 12px; font-size:15px; font-weight:700; color:var(--ink); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--brand); color:var(--white); border:none; border-radius:999px;
    font-family:inherit; font-weight:800; font-size:15px; padding:14px 26px;
    cursor:pointer; transition:background .12s ease, transform .08s ease;
  }
  .btn:hover{ background:var(--brand-dark); }
  .btn:active{ transform:scale(.97); }
  .btn.block{ width:100%; }
  .btn.ghost{ background:transparent; color:var(--brand); border:1px solid var(--brand); }
  .btn[disabled]{ opacity:.45; cursor:default; }
  .next-row{ margin-top:18px; display:flex; justify-content:flex-end; }
  .section-label{ font-size:13px; font-weight:800; color:var(--muted); text-transform:none; margin:6px 0 2px; }
  .hubspot-shell{
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    padding:20px;
  }
  .hubspot-placeholder{
    border:1.5px dashed var(--border); border-radius:var(--radius-sm);
    padding:26px 18px; text-align:center; color:var(--muted); font-size:13.5px; line-height:1.6;
  }
  .prize-shell{
    background:var(--white); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; text-align:center;
  }
  .prize-prompt{ font-size:16px; font-weight:800; color:var(--ink); margin:0 0 4px; }
  .mystery-row{ display:flex; gap:12px; justify-content:center; }
  .mystery-card{
    flex:1; max-width:130px; aspect-ratio:3/4;
    perspective:800px; cursor:pointer;
  }
  .mystery-card-inner{
    position:relative; width:100%; height:100%;
    transition:transform .6s cubic-bezier(.34,1.56,.64,1);
    transform-style:preserve-3d;
  }
  .mystery-card.flipped .mystery-card-inner{ transform:rotateY(180deg); }
  .mystery-card-face{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    border-radius:var(--radius-sm); backface-visibility:hidden;
    padding:10px; text-align:center;
  }
  .mystery-card-front{
    background:var(--brand); color:var(--white); font-size:16px; font-weight:800; line-height:1.3;
  }
  .mystery-card-back{
    background:var(--gold-tint); border:2px solid var(--gold);
    color:#4A3200; font-size:14px; font-weight:800; line-height:1.3;
    transform:rotateY(180deg);
  }
  .mystery-card:not(.flipped):hover .mystery-card-front{ background:var(--brand-dark); }
  .footer-actions{ display:flex; gap:12px; }
  .footer-actions .btn{ flex:1; }
  @media (max-width:380px){
  .hero h1{ font-size:28px; }
  .band-tile .lbl{ font-size:22px; }
  }

  /* ---------- iPad (portrait ~768-834px, landscape ~1024-1194px) ---------- */
  @media (min-width:700px){
  .wrap{ max-width:760px; gap:26px; }
  main{ padding:52px 32px 80px; }
  header{ padding:18px 32px; }
  header img.logo{ height:44px; }
  header .title{ font-size:19px; }
  .hero h1{ font-size:44px; }
  .hero p{ font-size:18px; max-width:52ch; }
  .band-grid{ gap:18px; }
  .band-tile{ min-height:190px; }
  .band-tile .lbl{ font-size:32px; }
  .task-head{ font-size:28px; }
  .choice{ font-size:18px; padding:16px 20px; min-height:64px; }
  .choice-letter{ width:38px; height:38px; }
  .rv-top{ font-size:18px; }
  .rv-pct{ font-size:20px; }
  .banner{ font-size:18px; }
  .callout{ font-size:16px; }
  .card{ padding:32px; }
  .hubspot-shell{ padding:28px; }
  .prize-shell{ padding:28px; }
  .mystery-card{ max-width:160px; }
  .mystery-card-front{ font-size:19px; }
  .mystery-card-back{ font-size:16px; }
  .q-text{ font-size:22px; }
  .eyebrow{ font-size:14px; }
  .prompt{ font-size:17px; }
  .btn{ font-size:17px; padding:18px 30px; }
  }
</style>

<script>
/* =====================================================================
   QUESTION BANK
   Sources:
     - Grades 2, 4, 5, 6, 7, 8 — from genqdata.json.
     - Grade 3 — genqdata.json has none; this comes from a hardcoded
       "3|1"/"3|2" override found inside the live report's own code
       (Compass Math Teacher Report.dc.html), not from a data file.
   47 questions total. 7 carry a real image (see "img" fields below);
   the rest are text-only. Excluded throughout: any question whose
   image is only a text description with no matching asset in
   assets/ (e.g. the grade 2 straw question, two grade 6 ratio-table
   questions, the grade 7 number line, two grade 3 milestone-2
   questions) — see chat history for the full list and why.
   Each question carries real Compass Review Performance data:
   answer choice text, % of students who picked it, and the
   distractor rationale (why a student would pick that wrong answer).
===================================================================== */
const QDATA = {"2|1":[{"lc":"Use an appropriate tool to measure the length, in standard units, of an object","blocks":[{"kind":"text","text":"Sam is measuring a toy house. What is the length of the toy house, in centimeters?"},{"kind":"image","text":"Image shows a toy house being measured with a ruler. The toy house is aligned to the ruler, with its left edge at 4 cm and its right edge at 24 cm, giving a total measured length of 20 cm."}],"choices":[{"L":"A","text":"20","pct":18,"correct":true,"dr":"Correct."},{"L":"B","text":"21","pct":11,"correct":false,"dr":"Student counted the number of marked intervals instead of measuring the total length based on unit divisions."},{"L":"C","text":"24","pct":71,"correct":false,"dr":"Student chose the number on the ruler aligned to the end of the object being measured and did not account for the measurement not starting at zero."}],"img":"assets/g2_dollhouse.png"},{"lc":"Select an appropriate tool to measure the length, in standard units, of an object","blocks":[{"kind":"text","text":"Which unit would be the best unit for measuring the length of a book?"}],"choices":[{"L":"A","text":"yards","pct":17,"correct":false,"dr":"Student chose a unit that is too large for the object's length, perhaps thought it was a smaller unit of measurement."},{"L":"B","text":"meters","pct":36,"correct":false,"dr":"Student chose a unit that is too large for the object's length, perhaps thought it was a similar unit with a smaller scale."},{"L":"C","text":"centimeters","pct":47,"correct":true,"dr":"Correct."}]},{"lc":"Measure to determine how much longer one object is than another","blocks":[{"kind":"text","text":"Use the ruler in the picture to answer the question below. How many centimeters longer is the paintbrush than the tube of paint?"},{"kind":"image","text":"Image shows a ruler with a paintbrush and a tube of paint placed beneath it. The paintbrush measures 16 cm and the tube of paint measures 9 cm, for a difference of 7 cm."}],"choices":[{"L":"A","text":"7","pct":31,"correct":true,"dr":"Correct."},{"L":"B","text":"16","pct":61,"correct":false,"dr":"Student identified the length of one object but did not compare it to the other measurement."},{"L":"C","text":"25","pct":8,"correct":false,"dr":"Student added the lengths of the two objects instead of subtracting."}],"img":"assets/g2_paintbrush.png"}],"2|2":[{"lc":"Given the number of hundreds, tens, and/or ones, write a threedigit number","blocks":[{"kind":"text","text":"Which number represents the same amount as 7 tens, 4 ones, and 6 hundreds?"}],"choices":[{"L":"A","text":"476","pct":7,"correct":false,"dr":"Student reversed the place values of the largest and smallest units, treating the smallest unit as the leftmost digit and the largest unit as the rightmost digit."},{"L":"B","text":"674","pct":58,"correct":true,"dr":"Correct."},{"L":"C","text":"746","pct":35,"correct":false,"dr":"Student listed the digits in the given order instead of ordering the digits according to their place value."}]},{"lc":"Decompose a two-digit number into its tens and ones","blocks":[{"kind":"text","text":"Which amount is equal to 40?"}],"choices":[{"L":"A","text":"4 ones","pct":17,"correct":false,"dr":"Student misinterpreted the place values in the number, treating the larger place value as the smaller place value."},{"L":"B","text":"40 ones","pct":52,"correct":true,"dr":"Correct."},{"L":"C","text":"40 tens","pct":31,"correct":false,"dr":"Student misinterpreted the given number as the number of units of the largest place value."}]},{"lc":"Decompose a three-digit number into its hundreds, tens, and ones","blocks":[{"kind":"text","text":"Which of the following is equal to 307?"}],"choices":[{"L":"A","text":"3 hundreds + 7 tens","pct":20,"correct":false,"dr":"Student represented the non-zero digits of the original number, assigning them descending place values."},{"L":"B","text":"3 hundreds + 7 ones","pct":60,"correct":true,"dr":"Correct."},{"L":"C","text":"30 hundreds + 7 ones","pct":20,"correct":false,"dr":"Student attributed the first two digits of the given number to the highest place value of the number rather than separating them, likely because the second digit is a zero."}]},{"lc":"Compare two three-digit numbers by comparing the digits in each place value","blocks":[{"kind":"text","text":"Which symbol can be used in the blank to make a true sentence? 5 ones + 3 hundreds + 4 tens ___ 4 hundreds + 8 ones"}],"choices":[{"L":"A","text":"<","pct":52,"correct":true,"dr":"Correct."},{"L":"B","text":">","pct":24,"correct":false,"dr":"Student compared the numbers as if they were single values rather than considering their place values, OR misinterpreted the meaning of the comparison symbol."},{"L":"C","text":"=","pct":23,"correct":false,"dr":"Student added the digits on each side of the comparison without accounting for the place value of the digits."}]},{"lc":"Read and write numbers to 1,000 by moving between base-ten numerals (standard form) and expanded form","blocks":[{"kind":"text","text":"Which shows the number 403 in expanded form?"}],"choices":[{"L":"A","text":"40 + 3","pct":19,"correct":false,"dr":"Student misinterpreted how to decompose a number, combining two place values into a single value based on the digits rather than their place value."},{"L":"B","text":"400 + 3","pct":74,"correct":true,"dr":"Correct."},{"L":"C","text":"400 + 30","pct":7,"correct":false,"dr":"Student misinterpreted a non-zero digit with an adjacent zero digit as the value of the place value of the non-zero digit."}]},{"lc":"Read and write numbers to 1,000 by moving between number names (word form) and expanded form","blocks":[{"kind":"text","text":"What is another way to write the expression below? 20 + 7 + 600"}],"choices":[{"L":"A","text":"Two hundred sixty-seven","pct":13,"correct":false,"dr":"Student confused the tens place with the hundreds place."},{"L":"B","text":"Two hundred seventy-six","pct":16,"correct":false,"dr":"Student ignored place value and put the first digit of each addend in order from left to right."},{"L":"C","text":"Six hundred twenty-seven","pct":71,"correct":true,"dr":"Correct."}]}],"4|1":[{"lc":"Apply concepts of place value to recognize quotients and products in multiplication and division problems involving whole numbers and a factor of 10","blocks":[{"kind":"text","text":"Select two equations in which a 10 can be used in the blank to make the equation true."}],"choices":[{"L":"A","text":"200 \u00f7 ___ = 2","pct":28,"correct":false,"dr":"Student confused a difference of two orders of magnitude with a difference of one order of magnitude."},{"L":"B","text":"500 \u00f7 ___ = 50","pct":65,"correct":true,"dr":"Correct."},{"L":"C","text":"800 \u00f7 ___ = 8,000","pct":22,"correct":false,"dr":"Student misunderstood how division affects magnitude; may have thought that dividing by a value greater than 1 increases the result, similar to the effect of multiplication."},{"L":"D","text":"9,000 \u00f7 900 = ___","pct":42,"correct":true,"dr":"Correct."},{"L":"E","text":"40,000 \u00f7 400 = ___","pct":12,"correct":false,"dr":"Student confused a difference of two orders of magnitude with a difference of one order of magnitude."}],"typeLabel":"Multiple Select","points":"2"},{"lc":"Recognize that in a multi-digit whole number, a digit in one place represents ten times what it represents in the place to its right","blocks":[{"kind":"text","text":"Which statement can be placed in the blank to make the sentence true? The value of the 6 in 56,780 is ___ the value of the 6 in 8,630."}],"choices":[{"L":"A","text":"the same as","pct":10,"correct":false,"dr":"Student may have thought that the value of a digit is unaffected by its place value."},{"L":"B","text":"10 times as much as","pct":52,"correct":true,"dr":"Correct."},{"L":"C","text":"100 times as much as","pct":13,"correct":false,"dr":"Student may have thought that the value of a digit is 100 times greater when it appears one place to the left, without considering the actual place value positions of the digits."},{"L":"D","text":"1,000 times as much as","pct":25,"correct":false,"dr":"Student may have thought that the value of a digit is 1,000 times greater when it appears one place to the left, without considering the actual place value positions of the digits."}]},{"lc":"Read and write multi-digit numbers up to 1,000,000 by moving between base-ten numerals (standard form) and expanded form","blocks":[{"kind":"text","text":"Which values represent 750,804? Select two that apply."}],"choices":[{"L":"A","text":"700 + 50 + 800 + 4","pct":22,"correct":false,"dr":"Student viewed the number as two separate parts separated by the comma."},{"L":"B","text":"4 + 50,000 + 80 + 700,000","pct":14,"correct":false,"dr":"Student confused the place value of the 8 as the tens place instead of the hundreds place."},{"L":"C","text":"800 + 4 + 700,000 + 50,000","pct":56,"correct":true,"dr":"Correct."},{"L":"D","text":"Seventy-five thousand, eight hundred four","pct":23,"correct":false,"dr":"Student confused 750,000 with 75,000."},{"L":"E","text":"Seven hundred fifty thousand, eighty-four","pct":13,"correct":false,"dr":"Student confused the place value of the 8 as the tens place instead of the hundreds place."},{"L":"F","text":"Seven hundred fifty thousand, eight hundred four","pct":56,"correct":true,"dr":"Correct."}],"typeLabel":"Multiple Select","points":"2"},{"lc":"Compare two multi-digit numbers","blocks":[{"kind":"text","text":"Which statement is true?"}],"choices":[{"L":"A","text":"4,076 > 4,000 + 700 + 6","pct":27,"correct":false,"dr":"Student did not compare the digits in the hundreds places correctly."},{"L":"B","text":"4,076 < 4,000 + 700 + 6","pct":39,"correct":true,"dr":"Correct."},{"L":"C","text":"4,760 < 4,000 + 700 + 6","pct":10,"correct":false,"dr":"Student did not compare the digits in the tens places correctly."},{"L":"D","text":"4,760 = 4,000 + 700 + 6","pct":24,"correct":false,"dr":"Student misinterpreted the value of a digit by incorrectly identifying its place value."}]},{"lc":"Round multi-digit whole numbers to any place within 1,000,000","blocks":[{"kind":"text","text":"Select three numbers that round to 29,000 when rounded to the nearest thousand."}],"choices":[{"L":"A","text":"29,465","pct":66,"correct":true,"dr":"Correct."},{"L":"B","text":"28,477","pct":29,"correct":false,"dr":"Student may have incorrectly used a digit in the tens or ones place to round the number up to the next thousand."},{"L":"C","text":"29,763","pct":28,"correct":false,"dr":"Student may have truncated the number at the given place value rather than rounding to the given place value."},{"L":"D","text":"29,299","pct":72,"correct":true,"dr":"Correct."},{"L":"E","text":"28,632","pct":61,"correct":true,"dr":"Correct."}],"typeLabel":"Multiple Select","points":"2"}],"4|2":[{"lc":"Fluently add multi-digit whole numbers (sums to 1,000,000) using the standard algorithm","blocks":[{"kind":"text","text":"Solve. 26,957 + 347,082 = ?"}],"choices":[{"L":"A","text":"364,039","pct":17,"correct":false,"dr":"Student did not regroup from the thousands place to the ten thousands place."},{"L":"B","text":"373,039","pct":16,"correct":false,"dr":"Student did not regroup from the hundreds place to the thousands place."},{"L":"C","text":"373,939","pct":10,"correct":false,"dr":"Student did not regroup from the tens place to the hundreds place."},{"L":"D","text":"374,039","pct":56,"correct":true,"dr":"Correct."}]},{"lc":"Fluently subtract multi-digit whole numbers (minuend to 1,000,000) using the standard algorithm","blocks":[{"kind":"text","text":"Solve. 3,361 - 2,945 = ?"}],"choices":[{"L":"A","text":"416","pct":58,"correct":true,"dr":"Correct."},{"L":"B","text":"624","pct":6,"correct":false,"dr":"Student correctly subtracted the smaller digit from the larger digit in the ones and hundreds places but incorrectly reduced the digit in the thousands place, even though no regrouping was needed there."},{"L":"C","text":"1,426","pct":1 atio and then correctly simplified an incorrect ratio."},{"L":"D","text":"For every 7 gymnasts, there are 5 hockey players.","pct":11,"correct":false,"dr":"Student incorrectly used the total of the quantities as one part of the ratio, but determined the other quantity correctly and then correctly simplified an incorrect ratio."}]},{"lc":"Write a ratio to represent the relationship between two quantities","blocks":[{"kind":"text","text":"A committee of teachers and students is meeting with the school board to request funding for extracurricular activities. The committee is creating posters for the meeting using a box of markers. The box contains 28 black markers and 16 red markers. What is the ratio of black markers to red markers?"},{"kind":"image","text":"Image shows a committee meeting with teachers and students working together at tables creating posters."}],"choices":[{"L":"A","text":"4:7","pct":16,"correct":false,"dr":"Student confused the roles of the given values in setting up a ratio and found the reverse ratio."},{"L":"B","text":"4:11","pct":8,"correct":false,"dr":"Student interpreted the context as requiring a ratio of part to whole instead of part to part."},{"L":"C","text":"7:4","pct":68,"correct":true,"dr":"Correct."},{"L":"D","text":"7:11","pct":8,"correct":false,"dr":"Student interpreted the context as requiring a ratio of part to whole instead of part to part."}],"img":"assets/g6_committee.png"}],"7|1":[{"lc":"Represent proportional relationships with equations","blocks":[{"kind":"text","text":"Which relationships can be represented by the equation y = 1/5 x? Select all that apply."}],"choices":[{"L":"A","text":"A. One water jug holds 5 quarts. Let x represent the number of water jugs and y represent the number of quarts.","pct":50,"correct":false,"dr":"Student chose a situation which is represented by an equation that contains the inverse unit rate of the equation given (y = 5x); thought a ratio of 1:5 could be represented as (1/5)x."},{"L":"B","tex  the nearest 100","blocks":[{"kind":"text","text":"What is 354 rounded to the nearest hundred?"}],"choices":[{"L":"A","text":"300","pct":16,"correct":false,"dr":"Student rounded the correct place value, but rounded down when they should have rounded up."},{"L":"B","text":"350","pct":21,"correct":false,"dr":"Student rounded to the nearest ten instead of the nearest hundred."},{"L":"C","text":"360","pct":2,"correct":false,"dr":"Student identified the correct rule for how to round the given number, but applied that rule to the wrong place value."},{"L":"D","text":"400","pct":61,"correct":true,"dr":"Correct."}]}]};

/* =====================================================================
   SETTINGS: edit these to change copy, question pools, or the prize.
   Everything else below is game logic.
===================================================================== */

// Opening screen copy.
const HOOK_HEADLINE = "Can you spot the trap?";
const HOOK_SUBHEAD = "Real math questions. Real student answers.";
const HOOK_ACTION = "Pick a level";   // shown in bold
const HOOK_ACTION_TAIL = " to play.";

// Curated starting pools, one per level tile. Each id is "<set>#<position>"
// into QDATA above (e.g. "2|1#0" is the first question in set "2|1").
// Only single-answer questions with ONE clear most-common wrong answer
// belong here; anything else is skipped at load with a console warning.
const BANDS = [
  { id: "elementary", label: "Elementary",
    pool: ["2|1#0", "2|1#2", "2|2#0", "2|2#1", "4|2#1", "2|1#1"] },
  { id: "middle", label: "Middle school",
    pool: ["7|1#1", "8|1#1", "7|2#2", "7|1#3", "6|1#0"] },
];

// PRIZE: every visitor gets this same prize. Edit the text below any time
// (e.g. for a different event's giveaway item).
const PRIZE_NAME = "$5 for Coffee";

/* =====================================================================
   URL SETTINGS
   One file serves every event. The link decides which lead form shows:
     ?form=<HubSpot form id>   (default: TFA's form)
     ?portal= and ?region=     only needed if either ever changes
   e.g. yoursite.netlify.app/spot-the-misconception.html?form=7353cce0-3666-46e0-abcc-b3dddde4c09f
   To add an event: get its embed code from HubSpot (Marketing > Forms >
   Share > Embed code), then add a short link for it in _redirects.
===================================================================== */
const urlParams = new URLSearchParams(window.location.search);
const HUBSPOT_CONFIG = {
  portalId: urlParams.get("portal") || "39623185",
  formId: urlParams.get("form") || "8d854f82-b1f3-48b9-b891-957e7a3fe94f",
  region: urlParams.get("region") || "na1",
};

/* =====================================================================
   DATA HELPERS
===================================================================== */
const BY_ID = {};
Object.keys(QDATA).forEach(key => {
  QDATA[key].forEach((q, idx) => {
    q.id = key + "#" + idx;
    q.grade = parseInt(key.split("|")[0], 10);
    BY_ID[q.id] = q;
  });
});

// The most commonly chosen wrong answer: the real, most-teachable trap.
function topWrong(q){
  const wrong = q.choices.filter(c => !c.correct);
  return wrong.reduce((a, b) => (b.pct > a.pct ? b : a), wrong[0]);
}

function poolProblem(q){
  if(!q) return "not found";
  if(q.choices.filter(c => c.correct).length !== 1) return "not a single-answer question";
  const wrong = q.choices.filter(c => !c.correct);
  const top = Math.max.apply(null, wrong.map(c => c.pct));
  if(wrong.filter(c => c.pct === top).length > 1) return "tie for most common wrong answer";
  return null;
}
BANDS.forEach(band => {
  band.pool = band.pool.filter(id => {
    const problem = poolProblem(BY_ID[id]);
    if(problem){ console.warn("Skipping " + id + " in " + band.id + ": " + problem); return false; }
    return true;
  });
});

function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
// Escapes text and turns carets like 4^-10 into real superscripts.
function fmt(s){
  return esc(s).replace(/\^(-?\d+)/g, "<sup>$1</sup>");
}
function ordinal(n){
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function article(n){ return (n === 8 || n === 11 || n === 18) ? "an" : "a"; }
function stemOf(q){ return q.blocks.filter(b => b.kind === "text").map(b => b.text).join(" "); }
function imageHtml(q){
  return q.img ? `<img class="q-img" src="${q.img}" alt="Diagram for the question">` : "";
}

/* =====================================================================
   STATE + RENDERING
===================================================================== */
const state = {
  screen: "start",
  q: null,
  answered: false,
  seen: {},   // per level: questions already played, so visitors don't repeat
};

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(state.screen === "start") renderStart(app);
  else if(state.screen === "question") renderQuestion(app);
  else if(state.screen === "result") renderResult(app);
  try { window.scrollTo(0, 0); } catch(e) {}
}

function renderStart(app){
  const hero = document.createElement("div");
  hero.className = "hero";
  hero.innerHTML = `
    <h1>${esc(HOOK_HEADLINE)}</h1>
    <p>${esc(HOOK_SUBHEAD)}</p>
    <p><strong>${esc(HOOK_ACTION)}</strong>${esc(HOOK_ACTION_TAIL)}</p>
  `;
  app.appendChild(hero);

  const grid = document.createElement("div");
  grid.className = "band-grid";
  BANDS.forEach(band => {
    if(!band.pool.length) return;
    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = "band-tile";
    tile.innerHTML = `<span class="lbl">${esc(band.label)}</span>`;
    tile.onclick = () => startRound(band.id);
    grid.appendChild(tile);
  });
  app.appendChild(grid);
}

function startRound(bandId){
  const band = BANDS.find(b => b.id === bandId);
  const seen = state.seen[bandId] || (state.seen[bandId] = new Set());
  let candidates = band.pool.filter(id => !seen.has(id));
  if(!candidates.length){
    seen.clear();
    candidates = band.pool.filter(id => !state.q || id !== state.q.id);
    if(!candidates.length) candidates = band.pool.slice();
  }
  const id = candidates[Math.floor(Math.random() * candidates.length)];
  seen.add(id);
  state.q = BY_ID[id];
  state.answered = false;
  state.screen = "question";
  render();
}

/* ---------- Question: answer first, then reveal the trap ---------- */
function renderQuestion(app){
  const q = state.q;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <p class="eyebrow">${ordinal(q.grade)} grade question</p>
    <h2 class="task-head" id="head">Are you smarter than ${article(q.grade)} ${ordinal(q.grade)} grader?</h2>
    <p class="q-text">${fmt(stemOf(q))}</p>
    ${imageHtml(q)}
    <p class="prompt" id="prompt">Tap your answer</p>
    <div id="choices"></div>
    <div id="revealSlot"></div>
    <div class="next-row" id="nextSlot"></div>
  `;
  app.appendChild(card);

  const wrap = card.querySelector("#choices");
  q.choices.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.innerHTML = `<span class="choice-letter">${c.L}</span><span class="choice-text">${fmt(c.text)}</span>`;
    b.onclick = () => reveal(c, card);
    wrap.appendChild(b);
  });
}

function reveal(chosen, card){
  if(state.answered) return;
  state.answered = true;

  const q = state.q;
  const top = topWrong(q);
  const correct = q.choices.find(c => c.correct);

  card.querySelector("#head").textContent = "Did you fall for it?";
  card.querySelector("#prompt").remove();

  const wrap = card.querySelector("#choices");
  wrap.innerHTML = "";
  q.choices.forEach(c => {
    const kind = c.correct ? "correct" : (c === top ? "top" : "other");
    const tags = [];
    if(c === chosen) tags.push(`<span class="tag you">You</span>`);
    if(c.correct) tags.push(`<span class="tag ok">Correct</span>`);
    if(c === top) tags.push(`<span class="tag trap">Most common wrong answer</span>`);

    const row = document.createElement("div");
    row.className = "rv-row " + kind;
    row.innerHTML = `
      <span class="choice-letter">${c.L}</span>
      <div class="rv-main">
        <div class="rv-top"><span class="choice-text">${fmt(c.text)}</span><span class="rv-pct">${c.pct}%</span></div>
        <div class="rv-bar"><span data-w="${c.pct}"></span></div>
        <div class="rv-tags">${tags.join("")}</div>
      </div>
    `;
    wrap.appendChild(row);
  });
  setTimeout(() => {
    wrap.querySelectorAll(".rv-bar span").forEach(s => { s.style.width = s.dataset.w + "%"; });
  }, 30);

  let line;
  if(chosen.correct){
    line = correct.pct <= 40
      ? `Nice. Only ${correct.pct}% of students got this one right.`
      : `You got it, like ${correct.pct}% of students.`;
  } else if(chosen === top){
    line = `You fell for it, just like ${top.pct}% of students.`;
  } else {
    line = `You picked ${chosen.L}. Most students (${top.pct}%) picked ${top.L}.`;
  }

  let callouts = `<div class="callout"><strong>Why students pick ${top.L}</strong>${fmt(top.dr)}</div>`;
  if(!chosen.correct && chosen !== top && chosen.dr){
    callouts += `<div class="callout"><strong>Why students pick ${chosen.L}</strong>${fmt(chosen.dr)}</div>`;
  }
  card.querySelector("#revealSlot").innerHTML = `<div class="banner">${esc(line)}</div>${callouts}`;

  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = "Get My Prize";
  btn.onclick = () => { state.screen = "result"; render(); };
  card.querySelector("#nextSlot").appendChild(btn);
}

/* ---------- Result screen: explainer, prize, lead form ---------- */
let hubspotFormCounter = 0;
function renderHubspotForm(container){
  container.innerHTML = "";

  // Preview builds can't load HubSpot, so show a labeled stand-in.
  if(window.__PREVIEW__){
    container.innerHTML = `<div class="hubspot-placeholder">Preview only. The live HubSpot lead form appears here on the deployed site.</div>`;
    return;
  }

  const el = document.createElement("div");
  el.id = "hsForm" + (++hubspotFormCounter);
  container.appendChild(el);

  const create = () => {
    window.hbspt.forms.create({
      portalId: HUBSPOT_CONFIG.portalId,
      formId: HUBSPOT_CONFIG.formId,
      region: HUBSPOT_CONFIG.region,
      target: "#" + el.id,
    });
  };

  // The HubSpot embed library loads asynchronously from the script tag in
  // <head>. If it isn't ready yet, poll briefly rather than failing silently.
  if(window.hbspt && window.hbspt.forms){
    create();
  } else {
    let tries = 0;
    const waitForHubspot = setInterval(() => {
      tries++;
      if(window.hbspt && window.hbspt.forms){
        clearInterval(waitForHubspot);
        create();
      } else if(tries > 50){ // ~10s
        clearInterval(waitForHubspot);
        el.innerHTML = `<div class="hubspot-placeholder">Form couldn't load. Check your connection and try again.</div>`;
      }
    }, 200);
  }
}

function renderResult(app){
  const explain = document.createElement("div");
  explain.className = "card";
  explain.innerHTML = `
    <p class="eyebrow">How Compass Math thinks about this</p>
    <p class="q-text" style="font-weight:400; font-size:15.5px;">Every wrong answer in Compass Math is developed around a specific common student misconception. <strong>So every answer is a signal.</strong> Compass Math helps teachers understand their students' thinking and address common misconceptions that are blocking understanding.</p>
  `;
  app.appendChild(explain);

  const prizeShell = document.createElement("div");
  prizeShell.className = "prize-shell";
  prizeShell.innerHTML = `
    <p class="prize-prompt">Get My Prize</p>
    <div class="mystery-row">
      <div class="mystery-card" data-idx="0"><div class="mystery-card-inner">
        <div class="mystery-card-face mystery-card-front">Tap to reveal</div>
        <div class="mystery-card-face mystery-card-back">${esc(PRIZE_NAME)}</div>
      </div></div>
    </div>
  `;
  app.appendChild(prizeShell);
  setupPrizeCard(prizeShell);

  const hs = document.createElement("div");
  hs.className = "hubspot-shell";
  hs.innerHTML = `
    <p class="section-label">Thanks for playing with ANet!</p>
    <p style="font-size:14px; color:var(--muted); margin:0 0 14px;">Your digital gift card will be emailed in the next 24 hours.</p>
    <div id="hubspotTarget"></div>
  `;
  app.appendChild(hs);
  renderHubspotForm(hs.querySelector("#hubspotTarget"));

  const footer = document.createElement("div");
  footer.className = "footer-actions";
  footer.innerHTML = `<button class="btn ghost block" id="againBtn">Play again</button>`;
  app.appendChild(footer);
  footer.querySelector("#againBtn").onclick = () => { state.screen = "start"; render(); };
}

function setupPrizeCard(shell){
  const card = shell.querySelector(".mystery-card");
  card.onclick = () => {
    card.classList.add("flipped");
    card.onclick = null;
  };
}

render();

</script>
